<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0810" />
    <title>Study Hub не запущен</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background:
          radial-gradient(60% 50% at 80% 0%, rgb(109 40 217 / 0.35), transparent 70%), #0a0810;
        color: #ede9fe;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      }
      main {
        max-width: 460px;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 26px;
      }
      p {
        margin: 0 0 12px;
        color: #a09cb5;
        line-height: 1.55;
      }
      code {
        color: #ede9fe;
        background: #1a1428;
        border-radius: 6px;
        padding: 2px 6px;
      }
      button {
        margin-top: 12px;
        border: 0;
        border-radius: 999px;
        padding: 12px 24px;
        background: #8b5cf6;
        color: white;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #7c3aed;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Study Hub не запущен</h1>
      <p>
        Запусти его ярлыком <strong>«Study Hub»</strong> на рабочем столе или командой
        <code>npm start</code> в папке проекта.
      </p>
      <p id="status">Страница откроется сама, как только сервер заработает.</p>
      <button type="button" onclick="location.reload()">Проверить сейчас</button>
    </main>
    <script>
      // Waits for the server and opens the page that was asked for.
      setInterval(() => {
        fetch("/api/health", { cache: "no-store" })
          .then((response) => response.ok && location.reload())
          .catch(() => undefined);
      }, 3000);
    </script>
  </body>
</html>
